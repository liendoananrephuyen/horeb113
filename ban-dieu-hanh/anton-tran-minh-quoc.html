<style>
/* ── TOKENS ── */
:root {
  --bg:        #f5f3ff;
  --card:      #ffffff;
  --hero-a:    #f43f5e;
  --hero-b:    #6366f1;
  --acc:       #6366f1;
  --acc-soft:  #e0e7ff;
  --acc2:      #f59e0b;
  --t1:        #1e1b4b;
  --t2:        #4b5563;
  --t3:        #9ca3af;
  --shadow:    0 4px 28px rgba(99,102,241,.13);
  --shadow-sm: 0 2px 12px rgba(0,0,0,.06);
  --rd:        20px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f0d1e; --card: #1c1a30;
    --acc-soft: #2e2c50;
    --t1: #e8e6ff; --t2: #9ca3af; --t3: #4b5563;
    --shadow: 0 4px 28px rgba(0,0,0,.35); --shadow-sm: 0 2px 12px rgba(0,0,0,.25);
  }
}
:root[data-theme="light"] { --bg:#f5f3ff; --card:#fff; --acc-soft:#e0e7ff; --t1:#1e1b4b; --t2:#4b5563; --t3:#9ca3af; --shadow:0 4px 28px rgba(99,102,241,.13); }
:root[data-theme="dark"]  { --bg:#0f0d1e; --card:#1c1a30; --acc-soft:#2e2c50; --t1:#e8e6ff; --t2:#9ca3af; --t3:#4b5563; --shadow:0 4px 28px rgba(0,0,0,.35); }

/* ── RESET ── */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--t1); min-height:100vh; overflow-x:hidden; }
img  { display:block; max-width:100%; }
a    { text-decoration:none; -webkit-tap-highlight-color:transparent; }

/* ── PAGE ── */
.page { max-width:430px; margin:0 auto; }

/* ── HERO ── */
.hero {
  position:relative; height:230px; overflow:hidden;
  background: linear-gradient(135deg, var(--hero-a) 0%, #a855f7 55%, var(--hero-b) 100%);
}
#cvs { position:absolute; inset:0; width:100%; height:100%; }
.hero-fade {
  position:absolute; bottom:0; left:0; right:0; height:110px;
  background:linear-gradient(transparent, var(--bg));
}

.badge {
  position:absolute; top:16px; right:16px; z-index:10;
  width:48px; height:48px; border-radius:13px; overflow:hidden;
  border:2px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.18); backdrop-filter:blur(8px);
  display:flex; align-items:center; justify-content:center;
}
.badge img { width:100%; height:100%; object-fit:cover; }
.badge-fb  { font-size:18px; font-weight:900; color:#fff; letter-spacing:-1px; }

/* ── HALO AVATAR ── */
.head {
  position:relative; z-index:10;
  display:flex; flex-direction:column; align-items:center;
  margin-top:-88px; padding:0 20px;
}
.halo { position:relative; width:176px; height:176px; }
.halo::before {
  content:''; position:absolute; inset:-5px; border-radius:50%;
  background:conic-gradient(#f59e0b,#f43f5e,#a855f7,#6366f1,#0ea5e9,#10b981,#f59e0b);
  animation:spin 6s linear infinite; z-index:0;
}
.halo::after {
  content:''; position:absolute; inset:-14px; border-radius:50%;
  background:rgba(99,102,241,.25); filter:blur(14px); z-index:-1;
  animation:breathe 3.5s ease-in-out infinite;
}
@keyframes spin    { to { transform:rotate(360deg); } }
@keyframes breathe { 0%,100% { opacity:.35; } 50% { opacity:.8; } }

.av {
  position:relative; z-index:1;
  width:176px; height:176px; border-radius:50%;
  border:4px solid var(--bg); object-fit:cover; background:var(--acc-soft);
}
.av-init {
  position:relative; z-index:1;
  width:176px; height:176px; border-radius:50%;
  border:4px solid var(--bg);
  background:linear-gradient(135deg,var(--hero-a),var(--hero-b));
  display:none; align-items:center; justify-content:center;
  font-size:52px; font-weight:900; color:#fff;
}

.p-name  { margin-top:14px; font-size:26px; font-weight:800; letter-spacing:-.5px; text-align:center; text-wrap:balance; }
.p-doi   {
  margin-top:8px;
  background:linear-gradient(90deg,var(--hero-a),var(--hero-b));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  font-size:11px; font-weight:800; letter-spacing:.18em; text-transform:uppercase;
}
.p-quote { margin-top:10px; font-size:13.5px; font-style:italic; color:var(--t2); text-align:center; padding:0 28px; line-height:1.65; }

/* ── CONTENT ── */
.content { padding:20px 14px 60px; display:flex; flex-direction:column; gap:16px; }

/* ── CARD ── */
.card { background:var(--card); border-radius:var(--rd); box-shadow:var(--shadow); overflow:hidden; }

.section-label {
  font-size:10px; font-weight:800; letter-spacing:.2em;
  text-transform:uppercase; color:var(--acc); padding:16px 18px 0;
}

/* ── SLIDER ── */
.slide-wrap {
  position:relative; overflow:hidden; aspect-ratio:4/3;
  background:var(--acc-soft); cursor:grab;
}
.slide-wrap:active { cursor:grabbing; }
.slide-track {
  display:flex; height:100%;
  will-change:transform;
  transition:transform .38s cubic-bezier(.4,0,.2,1);
}
.slide-item { min-width:100%; height:100%; position:relative; }
.slide-item img { width:100%; height:100%; object-fit:cover; display:none; }
.slide-item img.loaded { display:block; }
.slide-ph {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  color:var(--t3); font-size:13px; gap:6px;
}

.slide-cap {
  position:absolute; bottom:0; left:0; right:0;
  background:linear-gradient(transparent,rgba(0,0,0,.55));
  color:#fff; font-size:12px; padding:28px 14px 10px;
  text-align:center; min-height:44px;
}

.slide-arrow {
  position:absolute; top:50%; transform:translateY(-50%);
  background:rgba(255,255,255,.22); backdrop-filter:blur(4px);
  border:none; border-radius:50%; width:36px; height:36px;
  font-size:20px; color:#fff; cursor:pointer; z-index:5;
  display:flex; align-items:center; justify-content:center;
  transition:background .2s;
}
.slide-arrow:hover  { background:rgba(255,255,255,.4); }
.slide-arrow.prev   { left:10px; }
.slide-arrow.next   { right:10px; }

.slide-footer { padding:12px 18px 16px; display:flex; flex-direction:column; gap:12px; }

.slide-dots { display:flex; justify-content:center; gap:6px; }
.dot {
  width:6px; height:6px; border-radius:50%; border:none; padding:0;
  background:var(--t3); cursor:pointer; transition:all .25s;
}
.dot.on { background:var(--acc); width:18px; border-radius:3px; }

.drive-btn {
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 20px; border-radius:12px;
  background:linear-gradient(90deg,var(--hero-a),var(--hero-b));
  color:#fff; font-size:14px; font-weight:700; letter-spacing:.01em;
  transition:opacity .2s, transform .15s;
}
.drive-btn:active { opacity:.88; transform:scale(.98); }

/* ── POEMS ── */
.poem-outer { display:flex; flex-direction:column; gap:12px; }
.poem-outer-label { font-size:10px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:var(--acc); padding:0 4px; }

.poem-card {
  background:var(--card); border-radius:var(--rd);
  box-shadow:var(--shadow); overflow:hidden;
  border-left:4px solid var(--acc2);
}
.poem-inner { padding:22px 22px 26px; }
.poem-title {
  font-size:17px; font-weight:800; color:var(--t1);
  margin-bottom:16px; line-height:1.35; text-wrap:balance;
}
.poem-title::before { content:'✦ '; color:var(--acc2); font-size:10px; vertical-align:middle; }
.poem-body  { font-size:14.5px; line-height:1.9; color:var(--t2); }
.poem-stanza{ margin-bottom:14px; }
.poem-stanza:last-child { margin-bottom:0; }
.poem-line  { display:block; }
.poem-sig   { margin-top:16px; text-align:right; font-size:12px; font-style:italic; color:var(--t3); white-space:pre-line; }

/* ── SCROLL REVEAL ── */
.reveal { opacity:0; transform:translateY(20px); transition:opacity .5s ease,transform .5s ease; }
.reveal.in { opacity:1; transform:none; }

/* ── FOOTER ── */
.footer { text-align:center; padding:0 20px 52px; font-size:11px; color:var(--t3); letter-spacing:.1em; }

/* ── LIGHTBOX ── */
.lb { display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.92); align-items:center; justify-content:center; }
.lb.open { display:flex; }
.lb img  { max-width:95vw; max-height:90vh; border-radius:10px; object-fit:contain; }
.lb-cap  { position:absolute; bottom:20px; left:0; right:0; text-align:center; font-size:13px; color:rgba(255,255,255,.65); }
.lb-x    { position:absolute; top:16px; right:20px; font-size:28px; color:#fff; opacity:.6; cursor:pointer; background:none; border:none; line-height:1; }

@media (prefers-reduced-motion:reduce) {
  .halo::before,.halo::after { animation:none; }
  .reveal { opacity:1; transform:none; transition:none; }
  .slide-track { transition:none; }
}
</style>
</head>
<body>
<div class="page">

  <!-- HERO -->
  <div class="hero">
    <canvas id="cvs"></canvas>
    <div class="hero-fade"></div>
    <div class="badge">
      <img src="logo.png" alt="Logo"
           onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span class="badge-fb" style="display:none">H</span>
    </div>
  </div>

  <!-- AVATAR + TÊN -->
  <div class="head">
    <div class="halo">
      <img class="av" id="av-img" src="" alt="Avatar"
           onerror="this.style.display='none';document.getElementById('av-init').style.display='flex'">
      <div class="av-init" id="av-init"></div>
    </div>
    <h1 class="p-name"  id="p-name"></h1>
    <p  class="p-doi"   id="p-doi"></p>
    <p  class="p-quote" id="p-quote"></p>
  </div>

  <div class="content" id="content-root"></div>
</div>

<!-- LIGHTBOX -->
<div class="lb" id="lb" onclick="closeLB()">
  <button class="lb-x" aria-label="Đóng">×</button>
  <img id="lb-img" src="" alt="" onclick="event.stopPropagation()">
  <p class="lb-cap" id="lb-cap"></p>
</div>

<script>
/* ── RENDER ── */
(function () {
  const p  = PROFILE;
  const $  = id => document.getElementById(id);
  const mk = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };

  document.getElementById('page-title').textContent = p.name + ' · H113';
  $('av-img').src = p.avatar;
  $('av-init').textContent = p.name.trim().split(' ').map(w => w[0]).slice(-2).join('');
  $('p-name').textContent  = p.name;
  $('p-doi').textContent   = p.doi + ' · Horeb 113';
  $('p-quote').textContent = '“' + p.quote + '”';

  const root = $('content-root');

  /* ── SLIDESHOW ── */
  if (p.photos && p.photos.length) {
    const card = mk('div', 'card reveal');

    const label = mk('div', 'section-label');
    label.textContent = 'Hình ảnh';
    card.appendChild(label);

    const wrap  = mk('div', 'slide-wrap');
    const track = mk('div', 'slide-track');

    p.photos.forEach((ph, i) => {
      const item = mk('div', 'slide-item');
      const img  = document.createElement('img');
      img.alt     = ph.cap || '';
      img.loading = 'eager';   // lazy + display:none = browser không load

      const phEl = mk('div', 'slide-ph');
      phEl.innerHTML = `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg> ${ph.cap || ''}`;

      img.onload  = () => { img.classList.add('loaded'); phEl.style.display = 'none'; };
      img.onerror = () => { phEl.innerHTML = ph.cap || 'Không tải được ảnh'; };
      img.src = ph.src;

      item.appendChild(phEl);
      item.appendChild(img);
      item.addEventListener('click', () => { if (img.classList.contains('loaded')) openLB(ph.src, ph.cap); });
      track.appendChild(item);
    });

    const capEl  = mk('div', 'slide-cap');
    capEl.textContent = p.photos[0].cap || '';

    const prevBtn = mk('button', 'slide-arrow prev');
    prevBtn.innerHTML = '&#8249;';
    prevBtn.setAttribute('aria-label', 'Trước');

    const nextBtn = mk('button', 'slide-arrow next');
    nextBtn.innerHTML = '&#8250;';
    nextBtn.setAttribute('aria-label', 'Tiếp');

    wrap.append(track, capEl, prevBtn, nextBtn);
    card.appendChild(wrap);

    /* dots + drive btn */
    const footer  = mk('div', 'slide-footer');
    const dotsEl  = mk('div', 'slide-dots');

    const dots = p.photos.map((_, i) => {
      const d = mk('button', 'dot' + (i === 0 ? ' on' : ''));
      d.setAttribute('aria-label', 'Ảnh ' + (i + 1));
      d.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(d);
      return d;
    });

    footer.appendChild(dotsEl);

    if (p.driveFolder) {
      const btn = mk('a', 'drive-btn');
      btn.href = p.driveFolder;
      btn.target = '_blank';
      btn.rel = 'noopener noreferrer';
      btn.innerHTML = `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 2 L2 7 L12 12 L22 7 Z"/><path d="M2 17 L12 22 L22 17"/><path d="M2 12 L12 17 L22 12"/></svg>Xem tất cả ảnh trên Drive`;
      footer.appendChild(btn);
    }

    card.appendChild(footer);
    root.appendChild(card);

    /* slider logic */
    let cur = 0;
    const n = p.photos.length;

    function goTo(idx) {
      cur = ((idx % n) + n) % n;
      track.style.transform = `translateX(-${cur * 100}%)`;
      capEl.textContent = p.photos[cur].cap || '';
      dots.forEach((d, i) => d.classList.toggle('on', i === cur));
    }

    prevBtn.addEventListener('click', e => { e.stopPropagation(); goTo(cur - 1); resetAuto(); });
    nextBtn.addEventListener('click', e => { e.stopPropagation(); goTo(cur + 1); resetAuto(); });

    let timer = setInterval(() => goTo(cur + 1), 4200);
    function resetAuto() { clearInterval(timer); timer = setInterval(() => goTo(cur + 1), 4200); }

    wrap.addEventListener('mouseenter', () => clearInterval(timer));
    wrap.addEventListener('mouseleave', () => resetAuto());

    /* swipe */
    let tx0 = 0;
    wrap.addEventListener('touchstart', e => { tx0 = e.touches[0].clientX; clearInterval(timer); }, { passive:true });
    wrap.addEventListener('touchend',   e => {
      const dx = e.changedTouches[0].clientX - tx0;
      if (Math.abs(dx) > 45) goTo(cur + (dx < 0 ? 1 : -1));
      resetAuto();
    }, { passive:true });
  }

  /* ── POEMS ── */
  if (p.poems && p.poems.length) {
    const outer = mk('div', 'poem-outer');
    const lbl   = mk('div', 'poem-outer-label');
    lbl.textContent = 'Thơ tặng bạn';
    outer.appendChild(lbl);

    p.poems.forEach(poem => {
      const card  = mk('div', 'poem-card reveal');
      const inner = mk('div', 'poem-inner');

      const h = mk('h2', 'poem-title');
      h.textContent = poem.title;
      inner.appendChild(h);

      const body = mk('div', 'poem-body');
      let stanza = mk('div', 'poem-stanza');
      poem.lines.forEach(line => {
        if (line === '') { body.appendChild(stanza); stanza = mk('div', 'poem-stanza'); }
        else { const s = mk('span', 'poem-line'); s.textContent = line; stanza.appendChild(s); }
      });
      body.appendChild(stanza);
      inner.appendChild(body);

      const sig = mk('p', 'poem-sig');
      sig.textContent = poem.sig ?? '— TM. Ban điều hành Sa mạc Horeb 113 \n  SMP Tr. Giuse Đào Tuấn Khanh';
      inner.appendChild(sig);

      card.appendChild(inner);
      outer.appendChild(card);
    });

    root.appendChild(outer);
  }

  /* ── FOOTER ── */
  const ft = mk('div', 'footer reveal');
  ft.innerHTML = '<p>Sa mạc Horeb 113 &nbsp;·&nbsp; Hè 2026</p>';
  root.appendChild(ft);

  /* ── SCROLL REVEAL ── */
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); } });
  }, { threshold: 0.10 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
})();

/* ── LIGHTBOX ── */
function openLB(src, cap) {
  document.getElementById('lb-img').src = src;
  document.getElementById('lb-cap').textContent = cap || '';
  document.getElementById('lb').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLB() {
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(() => { document.getElementById('lb-img').src = ''; }, 300);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLB(); });

/* ── PARTICLES (hero) ── */
(function () {
  const c = document.getElementById('cvs');
  const x = c.getContext('2d');
  const COLS = ['rgba(255,255,255,', 'rgba(255,220,240,', 'rgba(210,210,255,'];
  let D = [];

  function rsz() { c.width = c.offsetWidth; c.height = c.offsetHeight; }
  function init() {
    rsz();
    D = Array.from({ length: 55 }, () => ({
      x: Math.random() * c.width,  y: Math.random() * c.height,
      r: Math.random() * 1.8 + .4,
      vx: (Math.random() - .5) * .22, vy: (Math.random() - .5) * .22,
      a: Math.random() * .5 + .1,
      col: COLS[Math.floor(Math.random() * COLS.length)],
    }));
  }
  function draw() {
    x.clearRect(0, 0, c.width, c.height);
    D.forEach(d => {
      d.x += d.vx; d.y += d.vy;
      if (d.x < 0 || d.x > c.width)  d.vx *= -1;
      if (d.y < 0 || d.y > c.height) d.vy *= -1;
      x.beginPath(); x.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      x.fillStyle = d.col + d.a + ')'; x.fill();
    });
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', init);
  init();
  if (!matchMedia('(prefers-reduced-motion:reduce)').matches) draw();
})();
</script>
