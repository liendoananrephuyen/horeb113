<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nhập Sa Mạc · Horeb 113</title>
<style>
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { width:100%; height:100%; background:#000; color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; overflow:hidden; }

/* ── SCAN ── */
#view-scan { position:fixed; inset:0; }
#vid { width:100%; height:100%; object-fit:cover; }
#cvs { display:none; }

.scan-ui {
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  pointer-events:none;
}
.scan-box {
  width:230px; height:230px; border-radius:18px;
  border:2px solid rgba(99,249,150,.8);
  position:relative;
  box-shadow:0 0 0 4000px rgba(0,0,0,.42);
}
.scan-line {
  position:absolute; left:8px; right:8px; height:2px; border-radius:1px;
  background:linear-gradient(90deg,transparent,#4ade80,transparent);
  animation:sweep 2s ease-in-out infinite;
}
@keyframes sweep { 0%,100%{top:12%;} 50%{top:82%;} }

.scan-tip {
  margin-top:28px; font-size:14px; color:rgba(255,255,255,.75);
  letter-spacing:.04em; text-align:center; padding:0 20px;
}

/* ── RATE BOTTOM SHEET ── */
#view-rate {
  position:fixed; inset:0;
  display:flex; align-items:flex-end; justify-content:center;
  background:rgba(0,0,0,.55); backdrop-filter:blur(3px);
}
.rate-card {
  width:100%; max-width:430px;
  background:#12111d; border-radius:26px 26px 0 0;
  padding:10px 28px 52px;
  display:flex; flex-direction:column; align-items:center; gap:12px;
}
.rate-handle {
  width:40px; height:4px; border-radius:2px;
  background:#333; margin-bottom:8px;
}
.rate-team {
  font-size:11px; font-weight:800; letter-spacing:.2em;
  text-transform:uppercase; color:#818cf8;
}
.rate-name {
  font-size:23px; font-weight:800; text-align:center;
  color:#fff; line-height:1.3; text-wrap:balance;
}
.stars { display:flex; gap:6px; margin:6px 0; }
.star {
  font-size:46px; background:none; border:none;
  color:#2d2d40; cursor:pointer;
  transition:color .12s, transform .1s;
  line-height:1; padding:0 3px;
  -webkit-tap-highlight-color:transparent;
}
.star.on { color:#fbbf24; }
.star:active { transform:scale(1.18); }

.score-label { font-size:14px; color:#6b7280; min-height:20px; }
.score-label.set { color:#fbbf24; font-weight:700; }

.btn-submit {
  width:100%; padding:16px;
  background:linear-gradient(90deg,#6366f1,#a855f7);
  color:#fff; font-size:16px; font-weight:800;
  border:none; border-radius:14px; cursor:pointer;
  transition:opacity .2s, transform .12s; margin-top:6px;
}
.btn-submit:disabled { opacity:.3; cursor:not-allowed; }
.btn-submit:not(:disabled):active { transform:scale(.98); }

.btn-cancel {
  background:none; border:none; color:#4b5563;
  font-size:14px; cursor:pointer; padding:8px;
  -webkit-tap-highlight-color:transparent;
}

/* ── DONE ── */
#view-done {
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.7);
}
.done-card {
  background:#12111d; border-radius:24px;
  padding:44px 56px;
  display:flex; flex-direction:column; align-items:center; gap:14px;
  animation:pop .25s ease;
}
@keyframes pop { from{transform:scale(.8);opacity:0;} to{transform:scale(1);opacity:1;} }
.done-icon {
  width:76px; height:76px; border-radius:50%;
  background:#22c55e;
  display:flex; align-items:center; justify-content:center;
  font-size:38px; font-weight:900;
}
.done-name { font-size:16px; font-weight:700; color:#fff; text-align:center; }
.done-sub  { font-size:13px; color:#4b5563; }

[hidden] { display:none !important; }
</style>
</head>
<body>

<!-- SCAN VIEW -->
<div id="view-scan">
  <video id="vid" playsinline autoplay muted></video>
  <canvas id="cvs"></canvas>
  <div class="scan-ui">
    <div class="scan-box"><div class="scan-line"></div></div>
    <p class="scan-tip" id="scan-tip">Đưa camera vào mã QR trên thẻ tên</p>
  </div>
</div>

<!-- RATE VIEW (bottom sheet, overlays on top of scan) -->
<div id="view-rate" hidden>
  <div class="rate-card">
    <div class="rate-handle"></div>
    <p class="rate-team" id="rate-team"></p>
    <h2 class="rate-name" id="rate-name"></h2>
    <div class="stars">
      <button class="star" data-v="1">★</button>
      <button class="star" data-v="2">★</button>
      <button class="star" data-v="3">★</button>
      <button class="star" data-v="4">★</button>
      <button class="star" data-v="5">★</button>
    </div>
    <p class="score-label" id="score-label">Chọn số sao</p>
    <button class="btn-submit" id="btn-submit" disabled>Gửi điểm</button>
    <button class="btn-cancel" id="btn-cancel">Hủy, quét lại</button>
  </div>
</div>

<!-- DONE VIEW -->
<div id="view-done" hidden>
  <div class="done-card">
    <div class="done-icon">✓</div>
    <p class="done-name" id="done-name"></p>
    <p class="done-sub">Đã lưu vào bảng điểm</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
// ── CẤU HÌNH ──────────────────────────────────────────
const SERVER = 'https://hylecuoicung.com/api/bangdiem';
const STAR_LABELS = ['', 'Chưa đạt', 'Đạt', 'Khá', 'Tốt', 'Xuất sắc'];
// ──────────────────────────────────────────────────────

const vid     = document.getElementById('vid');
const cvs     = document.getElementById('cvs');
const ctx     = cvs.getContext('2d', { willReadFrequently: true });

let scanning   = false;
let rafId      = null;
let curData    = null;
let curScore   = 0;

// ── CAMERA ──
navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } })
  .then(stream => {
    vid.srcObject = stream;
    vid.addEventListener('loadedmetadata', () => { scanning = true; tick(); });
  })
  .catch(() => {
    document.getElementById('scan-tip').textContent = '❌ Không mở được camera. Hãy cấp quyền rồi tải lại trang.';
  });

// ── QR SCAN LOOP ──
function tick() {
  if (!scanning) return;
  if (!vid.videoWidth) { rafId = requestAnimationFrame(tick); return; }

  cvs.width  = vid.videoWidth;
  cvs.height = vid.videoHeight;
  ctx.drawImage(vid, 0, 0);

  const img    = ctx.getImageData(0, 0, cvs.width, cvs.height);
  const result = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });

  if (result) {
    const parsed = parseQrUrl(result.data);
    if (parsed) {
      scanning = false;
      cancelAnimationFrame(rafId);
      showRate(parsed);
      return;
    }
  }

  rafId = requestAnimationFrame(tick);
}

// ── PARSE URL ──
// Nhận dạng: .../doi-{N}/{ten-slug}.html
function parseQrUrl(url) {
  const m = url.match(/\/doi-(\d+)\/([^/?#]+)\.html/i);
  if (!m) return null;
  const doi = m[1];
  const ten = m[2].split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  return { doi, ten };
}

// ── SHOW RATE ──
function showRate({ doi, ten }) {
  curData  = { doi, ten };
  curScore = 0;

  document.getElementById('rate-team').textContent   = 'Đội ' + doi;
  document.getElementById('rate-name').textContent   = ten;
  document.getElementById('score-label').textContent = 'Chọn số sao';
  document.getElementById('score-label').classList.remove('set');
  document.getElementById('btn-submit').disabled = true;
  document.getElementById('btn-submit').textContent  = 'Gửi điểm';
  document.querySelectorAll('.star').forEach(s => s.classList.remove('on'));

  document.getElementById('view-rate').hidden = false;
}

// ── STARS ──
document.querySelectorAll('.star').forEach(s => {
  s.addEventListener('click', () => {
    curScore = +s.dataset.v;
    document.querySelectorAll('.star').forEach(star => {
      star.classList.toggle('on', +star.dataset.v <= curScore);
    });
    const lbl = document.getElementById('score-label');
    lbl.textContent = curScore + ' sao — ' + STAR_LABELS[curScore];
    lbl.classList.add('set');
    document.getElementById('btn-submit').disabled = false;
  });
});

// ── SUBMIT ──
document.getElementById('btn-submit').addEventListener('click', async () => {
  if (!curData || !curScore) return;
  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = 'Đang gửi…';

  try {
    const res = await fetch(SERVER, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doi: curData.doi, ten: curData.ten, diem: curScore }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    showDone(curData.ten);
  } catch (e) {
    alert('Lỗi gửi dữ liệu: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Gửi điểm';
  }
});

// ── CANCEL ──
document.getElementById('btn-cancel').addEventListener('click', resetScan);

// ── DONE ──
function showDone(ten) {
  document.getElementById('view-rate').hidden = true;
  document.getElementById('done-name').textContent = ten;
  document.getElementById('view-done').hidden = false;
  setTimeout(resetScan, 1800);
}

// ── RESET ──
function resetScan() {
  document.getElementById('view-rate').hidden = true;
  document.getElementById('view-done').hidden = true;
  curData  = null;
  curScore = 0;
  scanning = true;
  tick();
}
</script>
</body>
</html>
